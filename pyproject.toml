[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-claim-audit"
version = "0.1.0"
description = "Offline audit of documented polarity-processing claims against Python AST evidence"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "sentiment-claim-audit contributors"}]

[project.scripts]
sentiment-claim-audit = "sentiment_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["sentiment_claim_audit*"]
